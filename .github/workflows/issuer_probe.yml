# Issuer Probe — fix_status N30, step 1. Manual only: Actions tab → "Issuer Probe" → Run workflow.
# Checks which issuers' official share-count pages answer from a GitHub runner and agree with the
# relay. Never writes the share store. Runs the offline selftest first. Commits logs/issuer_probe/.
name: Issuer Probe

on:
  workflow_dispatch:

concurrency:
  group: issuer-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests curl_cffi openpyxl

      - name: Selftest (offline)
        run: python issuer_probe.py --selftest

      - name: Probe issuer sources
        run: python issuer_probe.py

      - name: Commit probe results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/issuer_probe/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "issuer probe: $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push
          fi
